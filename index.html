<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
</head>
<body>
    <div class="container">
        <h1>Приложение погоды</h1>
            <form>
                <input type="text" id="city-input"  placeholder="Введите город">
                <input type="submit" value="Узнать погоду">
            </form>
            <div id="weather-data">
                <div class="icon">
                    <img src="http://openweathermap.org/img/wn/01d.png" alt="Weather Icon">
                </div>
                <div class="temperature">20°С</div>
                <div class="description">Солнечно</div>
                <div class="details">
                    <div>По ощущениям 23°С</div>
                    <div>Влажность 40%</div>
                    <div>Скорость ветра: 5м\с</div>
                </div>
            </div>
    </div>
</body>
</html>
